[package]
name = "tapflow-contract"
version = "2.0.0"
edition = "2021"
description = "TapFlow - Stellar Soroban fee sponsorship vault"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { version = "23", default-features = false }

[dev-dependencies]
soroban-sdk = { version = "23", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
overflow-checks = true
