[package]
name = "tapflow-contract"
version = "1.0.0"
edition = "2021"
description = "TapFlow - Stellar Soroban smart contract for fee sponsorship"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = { version = "21.0", features = ["alloc"] }

[dev-dependencies]
soroban-sdk = { version = "21.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
